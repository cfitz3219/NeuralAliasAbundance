# C2 (MASTER-PLAN Phase 1): the referee between the two agents. Every push and
# PR must configure, build and pass the non-GPU tests. GPU-labelled tests run
# only in Cort's Windows test sessions (no GPU on hosted runners).
name: build

on:
  push:
    branches: ["main", "claude/**", "astra/**"]
  pull_request:

jobs:
  windows:
    name: Windows x64 (MSVC) build + non-GPU tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (no NVIDIA SDKs on the runner; features gate off)
        run: cmake -S . -B build -A x64
      - name: Build Release
        shell: pwsh
        run: |
          # Compiler/linker errors are re-emitted as workflow annotations so agents
          # can read them through the API (raw job logs aren't reachable from their sandboxes).
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build-log.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path build-log.txt -Pattern ': (fatal )?error [A-Z]+[0-9]+|error MSB|LINK : fatal|: warning C[0-9]+' |
              Select-Object -First 40 | ForEach-Object {
                $m = ($_.Line -replace '^\s+','') -replace '\[[^\]]*\.vcxproj\]',''
                Write-Output "::error::$m"
              }
          }
          exit $code
      - name: Test (everything not labelled gpu)
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure -LE gpu 2>&1 | Tee-Object -FilePath ctest-log.txt
          $code = $LASTEXITCODE
          # Per-test verdicts as annotations (readable through the API): proves tests ran, not skipped.
          Select-String -Path ctest-log.txt -Pattern 'Test +#\d+: .*(Passed|Failed|Skipped|Not Run|\*\*\*)|tests passed|tests failed' |
            Select-Object -First 45 | ForEach-Object {
              $l = $_.Line.Trim()
              if ($l -match 'Failed|\*\*\*Exception|Not Run|tests failed') { Write-Output "::error::$l" } else { Write-Output "::notice::$l" }
            }
          exit $code
      - name: Deployment script tests (C5)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'   # report, don't abort, so the annotations below always run
          $proxy = Get-ChildItem build -Recurse -Filter sl.interposer.dll | Select-Object -First 1
          $stub = Get-ChildItem build -Recurse -Filter sl_interposer_real.dll | Select-Object -First 1
          Write-Output "::notice::deploy test inputs: proxy=$($proxy.FullName) stub=$($stub.FullName)"
          # Separate process: an exception inside the test can't kill this step before it is reported.
          pwsh -NoProfile -File ./scripts/tests/deploy-sl-proxy.tests.ps1 -Proxy "$($proxy.FullName)" -Stub "$($stub.FullName)" *> deploy-log.txt
          $code = $LASTEXITCODE
          Get-Content deploy-log.txt
          $fails = Select-String -Path deploy-log.txt -Pattern '^FAIL '
          $fails | ForEach-Object { Write-Output "::error::$($_.Line)" }
          if ($code -ne 0 -and -not $fails) {
            # Script stopped on an exception: surface its last lines.
            Get-Content deploy-log.txt | Select-Object -Last 8 | Where-Object { $_.Trim() } | ForEach-Object { Write-Output "::error::$_" }
          }
          $ok = (Select-String -Path deploy-log.txt -Pattern '^ok ').Count
          Write-Output "::notice::deploy-sl-proxy tests: $ok checks ok, $($fails.Count) failed"
          exit $code
      - name: Report failing tests as annotations
        if: failure()
        shell: pwsh
        run: |
          $log = 'build/Testing/Temporary/LastTest.log'
          if (Test-Path $log) {
            Select-String -Path $log -Pattern '^(FAIL|FATAL) |Test Failed|Exception|^checkpoint |^hooks installed|^producers:' | Select-Object -Last 9 |
              ForEach-Object { Write-Output "::error::$($_.Line)" }
          }
      - name: Summary (what got built; SDK gate states)
        shell: pwsh
        run: |
          "## Windows build" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Select-String -Path build/CMakeCache.txt -Pattern '^NA_' | ForEach-Object { $_.Line } | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-ChildItem build/Release -Include *.exe,*.dll -Recurse | ForEach-Object { "{0,12:N0}  {1}" -f $_.Length, $_.Name } | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
      - name: Keep the built binaries for inspection
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            build/Release/*.exe
            build/Release/*.dll
          if-no-files-found: warn

  windows-sdk:
    name: Windows x64 (MSVC) with public NVIDIA SDK headers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public NVIDIA headers (never committed; COLLABORATION.md rule 5)
        shell: pwsh
        run: |
          # DLSS/NGX SDK headers from github.com/NVIDIA/DLSS (pinned tag) and
          # pclstats.h from Streamline. Optical Flow 5 headers are not public, so
          # that gate stays off here (covered in Cort's local builds).
          git clone --quiet --depth 1 --branch v310.9.16 --filter=blob:none --sparse https://github.com/NVIDIA/DLSS sdk-src/dlss
          git -C sdk-src/dlss sparse-checkout set include
          git clone --quiet --depth 1 --branch v2.14.16 --filter=blob:none --sparse https://github.com/NVIDIA-RTX/Streamline sdk-src/sl
          git -C sdk-src/sl sparse-checkout set --no-cone /source/plugins/sl.pcl/pclstats.h
          New-Item -ItemType Directory -Force sdk/nvidia-dlss-sdk, sdk/pclstats | Out-Null
          Copy-Item -Recurse sdk-src/dlss/include sdk/nvidia-dlss-sdk/
          Copy-Item sdk-src/sl/source/plugins/sl.pcl/pclstats.h sdk/pclstats/
          # Intel XeSS public headers: only to cross-check our own ABI declarations (C7b).
          git clone --quiet --depth 1 --branch v3.0.2 --filter=blob:none --sparse https://github.com/intel/xess sdk-src/xess
          git -C sdk-src/xess sparse-checkout set inc
          New-Item -ItemType Directory -Force sdk/xess | Out-Null
          Copy-Item -Recurse sdk-src/xess/inc sdk/xess/
      - name: Configure
        run: cmake -S . -B build -A x64 -DNA_SDK_ROOT="${{ github.workspace }}/sdk"
      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build-log.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path build-log.txt -Pattern ': (fatal )?error [A-Z]+[0-9]+|error MSB|LINK : fatal|: warning C[0-9]+' |
              Select-Object -First 40 | ForEach-Object {
                $m = ($_.Line -replace '^\s+','') -replace '\[[^\]]*\.vcxproj\]',''
                Write-Output "::error::$m"
              }
          }
          exit $code
      - name: Test (everything not labelled gpu)
        shell: pwsh
        run: |
          Select-String -Path build/CMakeCache.txt -Pattern '^NA_(SDK_ROOT|NGX_SDK_INCLUDE|PCL_INCLUDE|NVOF_INCLUDE|XESS_INCLUDE)' | ForEach-Object { Write-Output "::notice::$($_.Line)" }
          ctest --test-dir build -C Release --output-on-failure -LE gpu --verbose 2>&1 | Tee-Object -FilePath ctest-log.txt
          $code = $LASTEXITCODE
          Select-String -Path ctest-log.txt -Pattern 'Test +#\d+: .*(Passed|Failed|Skipped|Not Run|\*\*\*)|tests passed|tests failed' |
            Select-Object -First 45 | ForEach-Object {
              $l = $_.Line.Trim()
              if ($l -match 'Failed|\*\*\*Exception|Not Run|tests failed') { Write-Output "::error::$l" } else { Write-Output "::notice::$l" }
            }
          exit $code
      - name: Report failing tests as annotations
        if: failure()
        shell: pwsh
        run: |
          $log = 'build/Testing/Temporary/LastTest.log'
          if (Test-Path $log) {
            Select-String -Path $log -Pattern '^(FAIL|FATAL) |Test Failed|Exception|^checkpoint |^hooks installed|^producers:' | Select-Object -Last 9 |
              ForEach-Object { Write-Output "::error::$($_.Line)" }
          }

  linux:
    name: Linux (GCC) portable core + CPU tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
