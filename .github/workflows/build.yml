# C2 (MASTER-PLAN Phase 1): the referee between the two agents. Every push and
# PR must configure, build and pass the non-GPU tests. GPU-labelled tests run
# only in Cort's Windows test sessions (no GPU on hosted runners).
name: build

on:
  push:
    branches: ["main", "claude/**", "astra/**"]
  pull_request:

permissions:
  contents: read
  pull-requests: write # failing-test output is posted on the branch's PR (annotations cap at 10 lines)

jobs:
  windows-x86-scope:
    # Bring-up of 32-bit game support: lists what in the host does not build for Win32 yet.
    # Informational until the 32-bit in-game half builds; it never fails the run.
    name: Windows x86 (MSVC) scope listing, informational
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Configure Win32
        run: cmake -S . -B build32 -A Win32 -DNA_ALLOW_X86=ON
      - name: Build Release, keep going, summarise errors
        shell: pwsh
        run: |
          cmake --build build32 --config Release --parallel -- /p:StopOnFirstFailure=false 2>&1 | Out-File -FilePath build32-log.txt -Encoding utf8
          $errs = Select-String -Path build32-log.txt -Pattern ': (fatal )?error [A-Z]+[0-9]+|LINK : fatal|error MSB|: warning C[0-9]+'
          Write-Output "X86-SCOPE total error lines: $($errs.Count)"
          Write-Output "X86-SCOPE errors by project:"
          $errs | ForEach-Object { if ($_.Line -match '\[([^\]]*\\)?([^\\\]]+)\.vcxproj\]') { $Matches[2] } else { '(none)' } } | Group-Object | Sort-Object Count -Descending | ForEach-Object { Write-Output ("  {0,5}  {1}" -f $_.Count, $_.Name) }
          Write-Output "X86-SCOPE errors by code:"
          $errs | ForEach-Object { if ($_.Line -match 'error ([A-Z]+[0-9]+)') { $Matches[1] } } | Group-Object | Sort-Object Count -Descending | ForEach-Object { Write-Output ("  {0,5}  {1}" -f $_.Count, $_.Name) }
          Write-Output "X86-SCOPE first 300 distinct error lines:"
          $errs | ForEach-Object { ($_.Line -replace '^\s+','') -replace ',\d+\)',')' } | Sort-Object -Unique | Select-Object -First 300 | ForEach-Object { Write-Output "  $_" }
          Write-Output "X86-SCOPE targets built:"
          $built = Select-String -Path build32-log.txt -Pattern '\.vcxproj -> ' | ForEach-Object { ($_.Line.Trim() -replace '^.*-> ','') -replace '^.*\\','' }
          Write-Output ("  count: " + @($built).Count)
          Write-Output ("  libraries and programs: " + ((@($built) | Where-Object { $_ -notmatch '^na_cpu_|_test\.exe$|_corpus\.exe$' }) -join ' '))
          exit 0
      - name: 32-bit tests (informational)
        shell: pwsh
        run: |
          ctest --test-dir build32 -C Release --output-on-failure -LE gpu --timeout 120 2>&1 | Select-Object -Last 60
          Write-Output "X86-SCOPE ctest exit code: $LASTEXITCODE"
          exit 0
      - name: Install script selftest with the 32-bit program
        shell: powershell
        run: |
          $dll = Get-ChildItem -Path build32 -Recurse -Filter NeuralAliasDXGI.dll | Select-Object -First 1
          if (-not $dll) { Write-Output 'X86-SCOPE no 32-bit NeuralAliasDXGI.dll was built'; exit 0 }
          & .\tools\deploy-native11.selftest.ps1 -Dll $dll.FullName
          Write-Output "X86-SCOPE install selftest exit code: $LASTEXITCODE"
          exit 0
      - name: 32-bit in-game half with the 64-bit DLAA companion, software device
        shell: pwsh
        run: |
          cmake -S . -B build64c -A x64 | Select-Object -Last 3
          cmake --build build64c --config Release --parallel --target NeuralAliasDlaa64 2>&1 | Select-Object -Last 5
          $companion = Get-ChildItem -Path build64c -Recurse -Filter NeuralAliasDlaa64.exe | Select-Object -First 1
          $test = Get-ChildItem -Path build32 -Recurse -Filter dlaa_companion_test.exe | Select-Object -First 1
          if (-not $companion -or -not $test) { Write-Output "X86-SCOPE handoff: missing companion=$($companion.FullName) test=$($test.FullName)"; exit 0 }
          Copy-Item $companion.FullName (Split-Path $test.FullName)
          & $test.FullName --warp
          Write-Output "X86-SCOPE 32-bit to 64-bit handoff exit code: $LASTEXITCODE"
          exit 0

  windows:
    name: Windows x64 (MSVC) build + non-GPU tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (no NVIDIA SDKs on the runner; features gate off)
        run: cmake -S . -B build -A x64
      - name: Build Release
        shell: pwsh
        run: |
          # Compiler/linker errors are re-emitted as workflow annotations so agents
          # can read them through the API (raw job logs aren't reachable from their sandboxes).
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build-log.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path build-log.txt -Pattern ': (fatal )?error [A-Z]+[0-9]+|error MSB|LINK : fatal|: warning C[0-9]+' |
              Select-Object -First 40 | ForEach-Object {
                $m = ($_.Line -replace '^\s+','') -replace '\[[^\]]*\.vcxproj\]',''
                Write-Output "::error::$m"
              }
          }
          exit $code
      - name: Test (everything not labelled gpu)
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure -LE gpu 2>&1 | Tee-Object -FilePath ctest-log.txt
          $code = $LASTEXITCODE
          # Per-test verdicts as annotations (readable through the API): proves tests ran, not skipped.
          Select-String -Path ctest-log.txt -Pattern 'Test +#\d+: .*(Passed|Failed|Skipped|Not Run|\*\*\*)|tests passed|tests failed' |
            ForEach-Object {
              $l = $_.Line.Trim()
              if ($l -match 'Failed|Timeout|\*\*\*|Not Run|tests failed') { Write-Output "::error::$l" }
            }
          exit $code
      - name: DLAA companion handoff on the software device (informational)
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure -R host_dlaa_companion_warp_test --timeout 120 2>&1 | Select-Object -Last 30
          Write-Output "DLAA-COMPANION warp ctest exit code: $LASTEXITCODE"
          exit 0
      - name: Deployment script tests (C5)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'   # report, don't abort, so the annotations below always run
          $proxy = Get-ChildItem build -Recurse -Filter sl.interposer.dll | Select-Object -First 1
          $stub = Get-ChildItem build -Recurse -Filter sl_interposer_real.dll | Select-Object -First 1
          Write-Output "::notice::deploy test inputs: proxy=$($proxy.FullName) stub=$($stub.FullName)"
          # Separate process: an exception inside the test can't kill this step before it is reported.
          pwsh -NoProfile -File ./scripts/tests/deploy-sl-proxy.tests.ps1 -Proxy "$($proxy.FullName)" -Stub "$($stub.FullName)" *> deploy-log.txt
          $code = $LASTEXITCODE
          Get-Content deploy-log.txt
          $fails = Select-String -Path deploy-log.txt -Pattern '^FAIL '
          $fails | ForEach-Object { Write-Output "::error::$($_.Line)" }
          if ($code -ne 0 -and -not $fails) {
            # Script stopped on an exception: surface its last lines.
            Get-Content deploy-log.txt | Select-Object -Last 8 | Where-Object { $_.Trim() } | ForEach-Object { Write-Output "::error::$_" }
          }
          $ok = (Select-String -Path deploy-log.txt -Pattern '^ok ').Count
          Write-Output "::notice::deploy-sl-proxy tests: $ok checks ok, $($fails.Count) failed"
          exit $code
      - name: Report failing tests as annotations
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $posted = $false
          $log = 'build/Testing/Temporary/LastTest.log'
          if (Test-Path $log) {
            # Last output lines of every failed / timed-out test, named (raw job logs are not readable by agents).
            $lines = Get-Content $log
            $name = ''; $buf = New-Object System.Collections.Generic.List[string]
            foreach ($l in $lines) {
              if ($l -match '^\d+/\d+ (Testing|Test): (\S+)') { $name = $Matches[2]; $buf.Clear(); continue }
              if ($l -match '^Test (Failed|Timeout)|^Test time .*|^"\S+" end time') {
                if ($l -match 'Failed|Timeout') {
                  # Last 12 lines, or the whole exit-watchdog dump when there is one (main thread first).
                  $wd = $buf.FindIndex({ param($x) $x -match 'exit watchdog: still running' })
                  $tail = if ($wd -ge 0) { $buf.GetRange($wd, $buf.Count - $wd) } else { $buf | Select-Object -Last 12 }
                  $tail | Select-Object -First 12 | ForEach-Object { Write-Output "::error::[$name] $_" }; Write-Output "::error::[$name] $l"
                  if ($wd -ge 0 -and -not $posted) {
                    # GitHub keeps only 10 error annotations per step, so the first watchdog dump goes on the PR.
                    $body = "**Exit watchdog on ``$name`` (" + '${{ github.sha }}' + ")**`n`n``````text`n" + (($tail | Select-Object -First 120) -join "`n") + "`n``````"
                    $body | Set-Content -Path watchdog.md
                    gh pr comment '${{ github.ref_name }}' --body-file watchdog.md 2>&1 | Write-Output
                    $posted = $true
                  }
                }
                continue
              }
              if ($l.Trim()) { $buf.Add($l) }
            }
          }
      - name: Summary (what got built; SDK gate states)
        shell: pwsh
        run: |
          "## Windows build" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Select-String -Path build/CMakeCache.txt -Pattern '^NA_' | ForEach-Object { $_.Line } | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-ChildItem build/Release -Include *.exe,*.dll -Recurse | ForEach-Object { "{0,12:N0}  {1}" -f $_.Length, $_.Name } | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
      - name: Keep the built binaries for inspection
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            build/Release/*.exe
            build/Release/*.dll
          if-no-files-found: warn

  windows-sdk:
    name: Windows x64 (MSVC) with public NVIDIA SDK headers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public NVIDIA headers (never committed; COLLABORATION.md rule 5)
        shell: pwsh
        run: |
          # DLSS/NGX SDK headers from github.com/NVIDIA/DLSS (pinned tag) and
          # pclstats.h from Streamline. Optical Flow 5 headers are not public, so
          # that gate stays off here (covered in Cort's local builds).
          git clone --quiet --depth 1 --branch v310.9.16 --filter=blob:none --sparse https://github.com/NVIDIA/DLSS sdk-src/dlss
          git -C sdk-src/dlss sparse-checkout set include
          git clone --quiet --depth 1 --branch v2.14.16 --filter=blob:none --sparse https://github.com/NVIDIA-RTX/Streamline sdk-src/sl
          git -C sdk-src/sl sparse-checkout set --no-cone /source/plugins/sl.pcl/pclstats.h
          New-Item -ItemType Directory -Force sdk/nvidia-dlss-sdk, sdk/pclstats | Out-Null
          Copy-Item -Recurse sdk-src/dlss/include sdk/nvidia-dlss-sdk/
          Copy-Item sdk-src/sl/source/plugins/sl.pcl/pclstats.h sdk/pclstats/
          # Intel XeSS public headers: only to cross-check our own ABI declarations (C7b).
          git clone --quiet --depth 1 --branch v3.0.2 --filter=blob:none --sparse https://github.com/intel/xess sdk-src/xess
          git -C sdk-src/xess sparse-checkout set inc
          New-Item -ItemType Directory -Force sdk/xess | Out-Null
          Copy-Item -Recurse sdk-src/xess/inc sdk/xess/
      - name: Configure
        run: cmake -S . -B build -A x64 -DNA_SDK_ROOT="${{ github.workspace }}/sdk"
      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build-log.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path build-log.txt -Pattern ': (fatal )?error [A-Z]+[0-9]+|error MSB|LINK : fatal|: warning C[0-9]+' |
              Select-Object -First 40 | ForEach-Object {
                $m = ($_.Line -replace '^\s+','') -replace '\[[^\]]*\.vcxproj\]',''
                Write-Output "::error::$m"
              }
          }
          exit $code
      - name: Test (everything not labelled gpu)
        shell: pwsh
        run: |
          Select-String -Path build/CMakeCache.txt -Pattern '^NA_(SDK_ROOT|NGX_SDK_INCLUDE|PCL_INCLUDE|NVOF_INCLUDE|XESS_INCLUDE)' | ForEach-Object { Write-Output "::notice::$($_.Line)" }
          ctest --test-dir build -C Release --output-on-failure -LE gpu --verbose -j 4 2>&1 | Tee-Object -FilePath ctest-log.txt
          $code = $LASTEXITCODE
          Select-String -Path ctest-log.txt -Pattern 'Test +#\d+: .*(Passed|Failed|Skipped|Not Run|\*\*\*)|tests passed|tests failed' |
            ForEach-Object {
              $l = $_.Line.Trim()
              if ($l -match 'Failed|Timeout|\*\*\*|Not Run|tests failed') { Write-Output "::error::$l" }
            }
          exit $code
      - name: Report failing tests as annotations
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $posted = $false
          $log = 'build/Testing/Temporary/LastTest.log'
          if (Test-Path $log) {
            # Last output lines of every failed / timed-out test, named (raw job logs are not readable by agents).
            $lines = Get-Content $log
            $name = ''; $buf = New-Object System.Collections.Generic.List[string]
            foreach ($l in $lines) {
              if ($l -match '^\d+/\d+ (Testing|Test): (\S+)') { $name = $Matches[2]; $buf.Clear(); continue }
              if ($l -match '^Test (Failed|Timeout)|^Test time .*|^"\S+" end time') {
                if ($l -match 'Failed|Timeout') {
                  # Last 12 lines, or the whole exit-watchdog dump when there is one (main thread first).
                  $wd = $buf.FindIndex({ param($x) $x -match 'exit watchdog: still running' })
                  $tail = if ($wd -ge 0) { $buf.GetRange($wd, $buf.Count - $wd) } else { $buf | Select-Object -Last 12 }
                  $tail | Select-Object -First 12 | ForEach-Object { Write-Output "::error::[$name] $_" }; Write-Output "::error::[$name] $l"
                  if ($wd -ge 0 -and -not $posted) {
                    # GitHub keeps only 10 error annotations per step, so the first watchdog dump goes on the PR.
                    $body = "**Exit watchdog on ``$name`` (" + '${{ github.sha }}' + ")**`n`n``````text`n" + (($tail | Select-Object -First 120) -join "`n") + "`n``````"
                    $body | Set-Content -Path watchdog.md
                    gh pr comment '${{ github.ref_name }}' --body-file watchdog.md 2>&1 | Write-Output
                    $posted = $true
                  }
                }
                continue
              }
              if ($l.Trim()) { $buf.Add($l) }
            }
          }

  linux:
    name: Linux (GCC) portable core + CPU tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Variants register
        run: python3 scripts/check_variants.py
      - name: Replay check self-test
        run: python3 scripts/score_run.py --self-test
      - name: Growth checker self-test
        run: python3 tools/growth_checker selftest
